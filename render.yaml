# Blueprint do Render — deploy do app (serviço único via Docker), sem Vercel.
# Como usar:
#   1. Suba este repositório no GitHub (já está).
#   2. Em https://dashboard.render.com => New => Blueprint => conecte o repo.
#   3. O Render lê este arquivo, pergunta as variáveis marcadas `sync: false`,
#      builda o Dockerfile e publica em https://<nome>.onrender.com.
#
# O banco é um PostgreSQL gerenciado **externo** (Supabase), informado em
# DATABASE_URL. Ficar fora do Render é proposital: os dados sobrevivem a
# recriar o serviço e não prendem a aplicação a uma hospedagem só.

services:
  - type: web
    name: mabegroup-dre
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # String de conexão do Postgres externo. Preenchida no painel do Render
      # (`sync: false` faz o Blueprint perguntar), nunca neste arquivo — ela
      # carrega a senha do banco, e senha em arquivo versionado fica no
      # histórico do Git para sempre.
      #
      # Use a string do **Session pooler** do Supabase, não a "Direct
      # connection": o host direto (db.<ref>.supabase.co) só publica endereço
      # IPv6, e a conexão falha de qualquer rede sem IPv6. O pooler responde em
      # IPv4 e se comporta como conexão direta.
      #
      #   postgresql://postgres.<ref>:<senha>@aws-0-<regiao>.pooler.supabase.com:5432/postgres
      #
      # A app detecta Postgres e cria/atualiza o schema sozinha no boot.
      - key: DATABASE_URL
        sync: false
      - key: INIT_DB
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@erp.local
      # Senha aleatória gerada pelo Render — some do repositório e some do
      # histórico do Git. Leia o valor uma vez em Environment do serviço e
      # troque pela sua em "Minha conta" logo no primeiro acesso.
      - key: ADMIN_SENHA
        generateValue: true
      # Restringe o CORS ao próprio domínio: como a interface é servida pelo
      # mesmo serviço, nenhuma outra origem precisa chamar esta API.
      - key: CORS_ORIGINS
        value: https://mabegroup-dre.onrender.com
      # Contas de proprietário criadas no primeiro boot, com perfil admin.
      - key: USUARIOS_INICIAIS
        value: arizono,Canaveze
      # A senha NÃO fica aqui: preencha em Environment, no painel do serviço.
      # Senha em arquivo versionado fica no histórico do Git para sempre,
      # inclusive depois de trocada no sistema.
      - key: SENHA_INICIAL
        sync: false
